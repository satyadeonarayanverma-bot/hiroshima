<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A romantic animated gift">
  <title>For You ♥</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient glow layers -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Starfield background -->
  <canvas id="starfield"></canvas>

  <!-- Rose petals container -->
  <div id="petals-container"></div>

  <!-- Floating hearts container -->
  <div id="hearts-container"></div>

  <!-- Fireflies / sparkles canvas -->
  <canvas id="fireflies"></canvas>

  <!-- Central romantic element -->
  <div class="center-piece">
    <div class="heart-container">
      <div class="heart-glow"></div>
      <div class="love-text">ILYSM<br>AQSAAAW!</div>
      <div class="heart-ring ring-1"></div>
      <div class="heart-ring ring-2"></div>
      <div class="heart-ring ring-3"></div>
    </div>
    <!-- Orbiting mini hearts -->
    <div class="orbit orbit-1"><div class="orbit-heart">♥</div></div>
    <div class="orbit orbit-2"><div class="orbit-heart">♥</div></div>
    <div class="orbit orbit-3"><div class="orbit-heart">♥</div></div>
    <div class="orbit orbit-4"><div class="orbit-heart">♥</div></div>
    <div class="orbit orbit-5"><div class="orbit-heart">♥</div></div>
  </div>

  <!-- Ribbon trails -->
  <canvas id="ribbons"></canvas>

  <!-- Click ripple layer -->
  <div id="ripple-layer"></div>

  <script src="script.js"></script>
</body>
</html>
